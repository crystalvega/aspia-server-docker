name: Build Aspia Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  ASPIA_VERSION: "3.0.30"

jobs:
  build-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Router
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.router
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aspia-router:${{ env.ASPIA_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aspia-router:latest

  build-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.relay
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aspia-relay:${{ env.ASPIA_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aspia-relay:latest
